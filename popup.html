<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remem</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        font: 14px/1.4 Arial, sans-serif;
        min-width: 180px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        font: inherit;
        box-sizing: border-box;
      }
      .field {
        margin-top: 10px;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .field input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font: inherit;
      }
      .actions {
        margin-top: 12px;
      }
      button {
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>Saving to Remem database</div>
    <div class="content">
      <textarea id="selection-text" placeholder="Selected text will appear here..."></textarea>
    </div>
    <div class="actions">
      <button id="mark-selected" type="button">Mark selected</button>
      <button id="close-popup" type="button">Close</button>
    </div>
    <div class="field">
      <label for="remem-url">Remem URL</label>
      <input id="remem-url" type="text" />
    </div>
    <div class="field">
      <label for="directory">Directory</label>
      <input id="directory" type="text" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
