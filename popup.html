<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        font: 14px/1.4 Arial, sans-serif;
        min-width: 180px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        font: inherit;
        box-sizing: border-box;
      }
      .actions {
        margin-top: 12px;
      }
      button {
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>Hello from plugin!</div>
    <div class="content">
      <textarea id="selection-text" placeholder="Selected text will appear here..."></textarea>
    </div>
    <div class="actions">
      <button id="close-popup" type="button">Close</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
